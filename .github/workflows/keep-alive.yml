name: Backend keep-alive

# Ping Render free-tier backend every 10 minutes so it does not sleep.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL secret is not set (e.g. https://your-api.onrender.com/api/health)."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 "$BACKEND_HEALTH_URL"
          echo "Keep-alive OK."
